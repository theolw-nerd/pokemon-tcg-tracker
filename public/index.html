<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Tracker</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e40;
      --text: #e8e8f0;
      --text-muted: #8888a8;
      --accent: #7c4dff;
      --accent-hover: #9c6fff;
      --danger: #ff4d6d;
      --warning: #ffb74d;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---- Login ---- */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .login-logo { font-size: 3.5rem; }
    .login-card h1 { font-size: 1.8rem; font-weight: 700; }
    .login-card p { color: var(--text-muted); line-height: 1.5; }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: white;
      color: #333;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-google:hover { opacity: 0.92; }

    /* ---- App shell ---- */
    #app { display: none; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      height: 56px;
      gap: 8px;
    }

    .nav-logo { font-weight: 700; font-size: 1.05rem; color: var(--accent); margin-right: 8px; white-space: nowrap; }

    .nav-pills { display: flex; gap: 4px; }

    .nav-pill {
      padding: 6px 16px;
      border-radius: 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .nav-pill:hover { background: var(--surface2); color: var(--text); }
    .nav-pill.active { background: var(--accent); color: white; }

    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    #user-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; display: none; }

    .btn-signout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-signout:hover { border-color: var(--text-muted); color: var(--text); }

    /* ---- Pages ---- */
    .page { display: none; padding: 24px 20px; max-width: 1200px; margin: 0 auto; }
    .page.active { display: block; }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-title { font-size: 1.4rem; font-weight: 700; }

    .stat-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ---- Search bar ---- */
    .search-bar-wrap { display: flex; gap: 10px; margin-bottom: 8px; }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .search-hint { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px; }

    /* ---- Collection filter ---- */
    .filter-wrap { margin-bottom: 16px; }

    .filter-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .filter-input:focus { border-color: var(--accent); }
    .filter-input::placeholder { color: var(--text-muted); }

    /* ---- Card grid ---- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
    }

    .card-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
    }
    .card-item:hover { transform: translateY(-2px); border-color: var(--accent); }
    .card-item.owned { border-color: var(--accent); }

    .card-img-wrap {
      aspect-ratio: 2.5 / 3.5;
      background: var(--surface2);
      overflow: hidden;
    }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card-info { padding: 10px 12px 8px; }

    .card-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Search qty controls ---- */
    .search-qty-row {
      display: flex;
      align-items: center;
      border-top: 1px solid var(--border);
    }

    .btn-sq {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.1rem;
      padding: 8px 0;
      cursor: pointer;
      transition: background 0.15s;
      line-height: 1;
    }
    .btn-sq:hover:not(:disabled) { background: var(--surface2); }
    .btn-sq:disabled { color: var(--border); cursor: default; }

    .sq-divider { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    .sq-num {
      flex: 1;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 0;
      transition: background 0.15s, color 0.15s;
    }

    .sq-num.owned {
      background: var(--accent);
      color: white;
    }

    /* ---- Collection card badges ---- */
    .cond-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px 12px 6px;
    }

    .condition-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .condition-badge.is-ordered {
      border-color: var(--warning);
      color: var(--warning);
    }

    .ordered-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--warning);
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      padding: 0 12px 10px;
      margin-top: auto;
    }

    .btn-sm {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--text); }
    .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ---- Modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .form-group { margin-bottom: 16px; }

    .form-group > .form-label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ---- Condition rows in modal ---- */
    .cond-row {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      gap: 8px;
    }

    .cond-row.is-ordered {
      border-color: var(--warning);
    }

    .cond-row-label {
      font-weight: 700;
      font-size: 0.88rem;
      flex: 1;
      min-width: 0;
    }

    .cond-row-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-qty-modal {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-qty-modal:hover { background: var(--accent); border-color: var(--accent); }

    .cond-qty-num {
      font-weight: 700;
      font-size: 1rem;
      min-width: 24px;
      text-align: center;
    }

    /* ---- Add condition section ---- */
    .add-cond-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .form-select {
      flex: 1;
      min-width: 110px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .form-select:focus { border-color: var(--accent); }

    .btn-add-cond {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-add-cond:hover { background: var(--accent-hover); }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }

    .btn-secondary {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.15s;
    }
    .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

    /* ---- Empty / loading ---- */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state h3 { font-size: 1.15rem; color: var(--text); margin-bottom: 6px; }

    .loading { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 0.95rem; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ======================== LOGIN ======================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🎴</div>
    <h1>Pokémon TCG Tracker</h1>
    <p>Track your collection, plan your binders, and manage your wishlist — from any device.</p>
    <button class="btn-google" id="btn-google-login">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.013 17.64 11.706 17.64 9.2z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- ======================== APP ======================== -->
<div id="app">
  <nav class="nav">
    <span class="nav-logo">🎴 TCG Tracker</span>
    <div class="nav-pills">
      <button class="nav-pill active" data-page="search">Search</button>
      <button class="nav-pill" data-page="collection">Collection</button>
    </div>
    <div class="nav-right">
      <img id="user-avatar" src="" alt="avatar">
      <button class="btn-signout" id="btn-signout">Sign out</button>
    </div>
  </nav>

  <!-- SEARCH PAGE -->
  <div class="page active" id="page-search">
    <div class="page-header">
      <h2 class="page-title">Search Cards</h2>
    </div>
    <div class="search-bar-wrap">
      <input class="search-input" id="search-input" type="text"
        placeholder='Try "pikachu", "charizard 4", or just "25"' />
      <button class="btn-primary" id="btn-search">Search</button>
    </div>
    <p class="search-hint">Search by name · number · or name + number together (e.g. "pikachu 25")</p>
    <div id="search-results"></div>
  </div>

  <!-- COLLECTION PAGE -->
  <div class="page" id="page-collection">
    <div class="page-header">
      <h2 class="page-title">My Collection</h2>
      <span class="stat-chip" id="collection-stat">0 cards</span>
    </div>
    <div class="filter-wrap">
      <input class="filter-input" id="collection-filter" type="text"
        placeholder="Filter by name or set…" />
    </div>
    <div id="collection-grid" class="card-grid"></div>
  </div>
</div>

<!-- ======================== EDIT MODAL ======================== -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3 id="edit-modal-name">Edit Card</h3>

    <div class="form-group">
      <span class="form-label">Copies by condition</span>
      <div id="edit-conditions-list"></div>
    </div>

    <div class="form-group" id="add-cond-section">
      <span class="form-label">Add a row</span>
      <div class="add-cond-row">
        <select class="form-select" id="add-cond-select">
          <option value="Ordered">Ordered</option>
          <option value="NM">NM</option>
          <option value="LP">LP</option>
          <option value="MP">MP</option>
          <option value="HP">HP</option>
          <option value="DMG">DMG</option>
        </select>
        <button class="btn-add-cond" id="btn-add-cond">Add</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="edit-cancel">Cancel</button>
      <button class="btn-primary" id="edit-save" style="flex:1">Save changes</button>
    </div>
  </div>
</div>

<!-- ======================== SCRIPT ======================== -->
<script type="module">
  import { initializeApp }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot }
    from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const fbApp = initializeApp({
    apiKey:            "AIzaSyCHGYmIdQQHHirsyGv_LCCHG_X2SFjv-Ds",
    authDomain:        "pokemon-tcg-tracker-tlw.firebaseapp.com",
    projectId:         "pokemon-tcg-tracker-tlw",
    storageBucket:     "pokemon-tcg-tracker-tlw.firebasestorage.app",
    messagingSenderId: "137900201924",
    appId:             "1:137900201924:web:47e0adb3edacb142e0b691"
  });

  const auth     = getAuth(fbApp);
  const db       = getFirestore(fbApp);
  const provider = new GoogleAuthProvider();

  let currentUser    = null;
  let collectionMap  = {};
  let editingId      = null;
  let editConditions = [];
  let unsubscribe    = null;

  // ---- Data helpers ----

  // Normalise any saved format to an array of { condition, quantity }
  // "Ordered" is now just another condition value.
  function getConditions(entry) {
    if (!entry) return [];
    if (Array.isArray(entry.conditions)) {
      return entry.conditions.map(r => ({
        condition: r.condition || 'NM',
        quantity:  r.quantity  || 1
      }));
    }
    // Legacy flat format (old ordered boolean → convert to "Ordered" condition)
    if (entry.condition) {
      const rows = [{ condition: entry.condition, quantity: entry.quantity || 1 }];
      if (entry.ordered) rows.unshift({ condition: 'Ordered', quantity: entry.quantity || 1 });
      return rows.filter((_, i) => i === 0); // just take one row for old data
    }
    return [{ condition: 'NM', quantity: 1 }];
  }

  function getTotalQty(entry) {
    return getConditions(entry).reduce((s, r) => s + r.quantity, 0);
  }

  // ===== AUTH =====
  document.getElementById('btn-google-login').addEventListener('click', () => {
    signInWithPopup(auth, provider).catch(err => alert('Sign-in failed: ' + err.message));
  });
  document.getElementById('btn-signout').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, user => {
    currentUser = user;
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      const av = document.getElementById('user-avatar');
      if (user.photoURL) { av.src = user.photoURL; av.style.display = 'block'; }
      startCollectionListener();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      collectionMap = {};
    }
  });

  // ===== NAVIGATION =====
  document.querySelectorAll('.nav-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      document.getElementById('page-' + pill.dataset.page).classList.add('active');
    });
  });

  // ===== SEARCH =====
  function buildQuery(raw) {
    const tokens = raw.trim().split(/\s+/);
    const nums   = tokens.filter(t => /^\d+$/.test(t));
    const words  = tokens.filter(t => !/^\d+$/.test(t));
    const parts  = [];
    if (words.length === 1) parts.push(`name:${words[0]}*`);
    else if (words.length > 1) parts.push(`name:"${words.join(' ')}"`);
    if (nums.length) parts.push(`number:${nums[0]}`);
    return parts.join(' ') || raw;
  }

  async function doSearch() {
    const raw = document.getElementById('search-input').value.trim();
    if (!raw) return;
    const resultsEl = document.getElementById('search-results');
    resultsEl.innerHTML = '<div class="loading">Searching…</div>';
    document.getElementById('btn-search').disabled = true;
    try {
      const q   = buildQuery(raw);
      const url = `https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=30&select=id,name,number,set,images`;
      const res = await fetch(url);
      const { data } = await res.json();
      if (!data || data.length === 0) {
        resultsEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h3>No results</h3>
            <p>Try a different search</p>
          </div>`;
        return;
      }
      renderSearchResults(data);
    } catch (e) {
      resultsEl.innerHTML = `<div class="empty-state"><h3>Search failed</h3><p>Please try again.</p></div>`;
    } finally {
      document.getElementById('btn-search').disabled = false;
    }
  }

  document.getElementById('btn-search').addEventListener('click', doSearch);
  document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  function searchCardHTML(c) {
    const entry = collectionMap[c.id];
    const qty   = getTotalQty(entry);
    const data  = encodeURIComponent(JSON.stringify(c));
    return `
      <div class="card-item${qty > 0 ? ' owned' : ''}" id="src-${c.id}">
        <div class="card-img-wrap">
          <img src="${c.images?.small || ''}" alt="${c.name}" loading="lazy">
        </div>
        <div class="card-info">
          <div class="card-name">${c.name}</div>
          <div class="card-meta">${c.set?.name || ''} · #${c.number || ''}</div>
        </div>
        <div class="search-qty-row">
          <button class="btn-sq" onclick="window._sqChange('${c.id}','${data}',-1)"
            ${qty === 0 ? 'disabled' : ''}>−</button>
          <div class="sq-divider"></div>
          <span class="sq-num${qty > 0 ? ' owned' : ''}">${qty}</span>
          <div class="sq-divider"></div>
          <button class="btn-sq" onclick="window._sqChange('${c.id}','${data}',1)">+</button>
        </div>
      </div>`;
  }

  let lastSearchCards = [];

  function renderSearchResults(cards) {
    lastSearchCards = cards;
    document.getElementById('search-results').innerHTML =
      `<div class="card-grid">${cards.map(searchCardHTML).join('')}</div>`;
  }

  function refreshSearchCards() {
    lastSearchCards.forEach(c => {
      const tile = document.getElementById('src-' + c.id);
      if (!tile) return;
      const qty = getTotalQty(collectionMap[c.id]);
      tile.classList.toggle('owned', qty > 0);
      const num   = tile.querySelector('.sq-num');
      const minus = tile.querySelector('.btn-sq');
      if (num) {
        num.textContent = qty;
        num.classList.toggle('owned', qty > 0);
      }
      if (minus) minus.disabled = qty === 0;
    });
  }

  // ===== COLLECTION LISTENER =====
  function startCollectionListener() {
    if (!currentUser) return;
    const colRef = collection(db, 'users', currentUser.uid, 'collection');
    unsubscribe = onSnapshot(colRef, snap => {
      collectionMap = {};
      snap.forEach(d => { collectionMap[d.id] = d.data(); });
      renderCollection();
      refreshSearchCards();
    });
  }

  // ===== RENDER COLLECTION =====
  let collectionFilter = '';

  document.getElementById('collection-filter').addEventListener('input', e => {
    collectionFilter = e.target.value.toLowerCase();
    renderCollection();
  });

  function renderCollection() {
    const grid = document.getElementById('collection-grid');
    let entries = Object.entries(collectionMap).sort(([,a],[,b]) => a.name.localeCompare(b.name));
    if (collectionFilter) {
      entries = entries.filter(([,c]) =>
        c.name.toLowerCase().includes(collectionFilter) ||
        (c.setName || '').toLowerCase().includes(collectionFilter)
      );
    }

    const total = Object.values(collectionMap).reduce((s,c) => s + getTotalQty(c), 0);
    document.getElementById('collection-stat').textContent = `${total} card${total !== 1 ? 's' : ''}`;

    if (Object.keys(collectionMap).length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">📦</div>
          <h3>Your collection is empty</h3>
          <p>Search for cards and use the + button to add them</p>
        </div>`;
      return;
    }
    if (entries.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <h3>No matches</h3>
          <p>Try a different filter</p>
        </div>`;
      return;
    }

    grid.innerHTML = entries.map(([id, c]) => {
      const conds    = getConditions(c);
      const totalQty = getTotalQty(c);
      const anyOrdered = conds.some(r => r.condition === 'Ordered');

      const badgesHTML = conds.map(r => {
        const isOrd = r.condition === 'Ordered';
        return `<span class="condition-badge${isOrd ? ' is-ordered' : ''}">${r.quantity}× ${r.condition}</span>`;
      }).join('');

      return `
        <div class="card-item owned">
          ${anyOrdered ? '<div class="ordered-badge">ORDERED</div>' : ''}
          <div class="card-img-wrap">
            <img src="${c.image || ''}" alt="${c.name}" loading="lazy">
          </div>
          <div class="card-info">
            <div class="card-name">${c.name}</div>
            <div class="card-meta">${c.setName || ''} · #${c.number || ''}</div>
          </div>
          <div class="coll-strip">Qty: ${totalQty}</div>
          <div class="cond-badges">${badgesHTML}</div>
          <div class="card-actions">
            <button class="btn-sm" onclick="window._openEdit('${id}')">Edit</button>
            <button class="btn-sm danger" onclick="window._remove('${id}')">Remove</button>
          </div>
        </div>`;
    }).join('');
  }

  // ===== CARD OPERATIONS =====

  // Search + / −: adjusts NM in-hand row (ordered: false)
  window._sqChange = async function(cardId, dataEnc, delta) {
    if (!currentUser) return;
    const c     = JSON.parse(decodeURIComponent(dataEnc));
    const entry = collectionMap[cardId];
    const ref   = doc(db, 'users', currentUser.uid, 'collection', cardId);

    if (!entry && delta > 0) {
      await setDoc(ref, {
        name:       c.name,
        number:     c.number        || '',
        setId:      c.set?.id       || '',
        setName:    c.set?.name     || '',
        image:      c.images?.small || '',
        addedAt:    new Date().toISOString(),
        conditions: [{ condition: 'NM', quantity: 1 }]
      });
      return;
    }
    if (!entry) return;

    const conds = getConditions(entry);

    if (delta > 0) {
      // Add to NM row; create one if it doesn't exist
      const nmRow = conds.find(r => r.condition === 'NM');
      if (nmRow) { nmRow.quantity++; }
      else { conds.unshift({ condition: 'NM', quantity: 1 }); }
      await updateDoc(ref, { conditions: conds });
    } else {
      // Remove from NM first; fall back to first row
      const target = conds.find(r => r.condition === 'NM') || conds[0];
      if (!target) return;
      target.quantity--;
      const cleaned = conds.filter(r => r.quantity > 0);
      if (cleaned.length === 0) { await deleteDoc(ref); }
      else { await updateDoc(ref, { conditions: cleaned }); }
    }
  };

  window._remove = async function(id) {
    if (!currentUser) return;
    if (!confirm('Remove this card from your collection?')) return;
    await deleteDoc(doc(db, 'users', currentUser.uid, 'collection', id));
  };

  // ===== EDIT MODAL =====

  const ALL_CONDITIONS = ['Ordered', 'NM', 'LP', 'MP', 'HP', 'DMG'];

  function renderEditConditions() {
    const list = document.getElementById('edit-conditions-list');

    if (editConditions.length === 0) {
      list.innerHTML = `<p style="color:var(--text-muted);font-size:0.85rem;padding:4px 0;">No copies — use "Add a row" below.</p>`;
    } else {
      list.innerHTML = editConditions.map((row, i) => {
        const isOrd = row.condition === 'Ordered';
        return `
          <div class="cond-row${isOrd ? ' is-ordered' : ''}">
            <span class="cond-row-label">${row.condition}</span>
            <div class="cond-row-controls">
              <button class="btn-qty-modal" onclick="window._editQty(${i},-1)">−</button>
              <span class="cond-qty-num">${row.quantity}</span>
              <button class="btn-qty-modal" onclick="window._editQty(${i},1)">+</button>
            </div>
          </div>`;
      }).join('');
    }

    // Rebuild dropdown — only show conditions not already present
    const used   = new Set(editConditions.map(r => r.condition));
    const select = document.getElementById('add-cond-select');
    select.innerHTML = ALL_CONDITIONS
      .filter(c => !used.has(c))
      .map(c => `<option value="${c}">${c}</option>`)
      .join('');

    document.getElementById('add-cond-section').style.display =
      used.size >= ALL_CONDITIONS.length ? 'none' : 'block';
  }

  window._editQty = function(idx, delta) {
    const row = editConditions[idx];
    if (!row) return;
    row.quantity += delta;
    if (row.quantity <= 0) editConditions.splice(idx, 1);
    renderEditConditions();
  };

  document.getElementById('btn-add-cond').addEventListener('click', () => {
    const cond = document.getElementById('add-cond-select').value;
    if (!cond || editConditions.find(r => r.condition === cond)) return;
    editConditions.push({ condition: cond, quantity: 1 });
    renderEditConditions();
  });

  window._openEdit = function(id) {
    editingId      = id;
    const entry    = collectionMap[id];
    if (!entry) return;
    editConditions = getConditions(entry).map(r => ({ ...r }));
    document.getElementById('edit-modal-name').textContent = entry.name;
    renderEditConditions();
    document.getElementById('edit-modal').classList.add('open');
  };

  function closeModal() {
    document.getElementById('edit-modal').classList.remove('open');
    editingId      = null;
    editConditions = [];
  }

  document.getElementById('edit-cancel').addEventListener('click', closeModal);
  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.getElementById('edit-save').addEventListener('click', async () => {
    if (!editingId || !currentUser) return;
    const ref = doc(db, 'users', currentUser.uid, 'collection', editingId);
    if (editConditions.length === 0) {
      if (confirm('All copies removed. Delete this card from your collection?')) {
        await deleteDoc(ref);
      } else { return; }
    } else {
      await updateDoc(ref, { conditions: editConditions });
    }
    closeModal();
  });
</script>
</body>
</html>
